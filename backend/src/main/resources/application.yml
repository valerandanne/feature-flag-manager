spring:
  application:
    name: feature-flag-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/feature-flags;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:feature-flags-test;DB_CLOSE_DELAY=-1
  flyway:
    locations: classpath:db/migration
